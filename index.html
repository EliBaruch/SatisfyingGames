<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7ccf5a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Bloom Rush</title>
  <meta name="description" content="Run, stack, sell and build your way through world after world. A free arcade idle game in your browser: no install, no ads.">
  <meta property="og:title" content="Bloom Rush">
  <meta property="og:description" content="Run, stack, sell and build, world after world. Free in your browser.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://bloom-rush-game.netlify.app/assets/ui/share.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/ui/icon-180.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cg fill='%23ff4d7d'%3E%3Ccircle cx='32' cy='16' r='13'/%3E%3Ccircle cx='48' cy='32' r='13'/%3E%3Ccircle cx='32' cy='48' r='13'/%3E%3Ccircle cx='16' cy='32' r='13'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='9' fill='%23ffd166'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./styles/title.css">
  <link rel="stylesheet" href="./styles/hud.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","addons":"./vendor/three-addons.min.js"}}</script>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <div id="joy-base" class="joy-base"></div>
  <div id="joy-knob" class="joy-knob"></div>

  <div id="hud" class="hud">
    <div id="topbar">
      <div id="money" class="money" aria-live="polite">
        <svg class="bill" viewBox="0 0 48 32" aria-hidden="true">
          <rect x="1" y="3" width="46" height="26" rx="5" fill="#2e9e44" stroke="#17602a" stroke-width="2"/>
          <rect x="5" y="7" width="38" height="18" rx="3" fill="#5fd06d"/>
          <circle cx="24" cy="16" r="6.5" fill="#c8f7c9" stroke="#2e9e44" stroke-width="2"/>
          <circle cx="10.5" cy="16" r="1.8" fill="#c8f7c9"/>
          <circle cx="37.5" cy="16" r="1.8" fill="#c8f7c9"/>
        </svg>
        <span id="money-value" class="num">0</span>
      </div>
      <div id="goal" class="goal"></div>
    </div>

    <div id="toast" class="toast" role="status"></div>

    <div id="hud-buttons" class="hud-buttons">
      <button id="btn-worlds" class="icon-btn" type="button" aria-label="World select">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 6.5l6-2.5 6 2.5 6-2.5v13l-6 2.5-6-2.5-6 2.5z"/>
          <path d="M9 4v13M15 6.5v13"/>
        </svg>
      </button>
      <button id="btn-mute" class="icon-btn" type="button" aria-label="Mute" aria-pressed="false">
        <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9h3.5L12 5.5v13L7.5 15H4z"/>
          <path d="M15.5 9.5a4 4 0 0 1 0 5M18 7a7.5 7.5 0 0 1 0 10"/>
        </svg>
        <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
          <path d="M4 9h3.5L12 5.5v13L7.5 15H4z"/>
          <path d="M16 9.5l5 5M21 9.5l-5 5"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Title screen. mode "start" (first screen: any tap outside a card plays) or "picker"
       (opened from the game: RESUME closes it). The world cards are built by hud.js. -->
  <div id="start" class="overlay start show" data-mode="start">
    <div class="start-inner">
      <div id="intro" class="intro" aria-hidden="true"><span id="intro-kicker" class="intro-kicker"></span><b id="intro-name" class="intro-name"></b><i class="intro-bar"><i id="intro-fill"></i></i></div>
      <h1 class="title">Bloom Rush</h1>
      <p class="tagline">Drag to run. Collect. Sell. Grow!</p>
      <div id="title-meta" class="title-meta"></div>
      <div id="worlds" class="wsel" role="group" aria-label="Worlds"></div>
      <button class="tap" type="button">TAP TO PLAY</button>
      <p id="perks" class="perks" hidden></p>
      <p id="world-perks" class="perks world-perks" hidden></p>
      <button id="btn-reset" class="link-btn" type="button">Reset all progress</button>
    </div>
  </div>

  <div id="win" class="overlay win" aria-hidden="true">
    <div class="card win-card" role="dialog" aria-labelledby="win-title">
      <p id="win-world" class="win-kicker">Flower Farm</p>
      <h2 id="win-title">WORLD COMPLETE!</h2>
      <dl class="stats">
        <div><dt>Time played</dt><dd id="win-time">0:00</dd></div>
        <div><dt>Total earned</dt><dd id="win-earned">0</dd></div>
        <div id="win-best-row" hidden><dt>Best time</dt><dd id="win-best">0:00</dd></div>
        <div id="win-run-row" hidden><dt>This run</dt><dd id="win-run"></dd></div>
        <div id="win-perk-row"><dt>Perk gained</dt><dd id="win-perk">+8% speed, +10 stack</dd></div>
      </dl>
      <button id="win-next" class="big-btn" type="button" hidden>NEXT: <span id="win-next-name"></span></button>
      <button id="win-picker" class="big-btn" type="button" hidden>WORLD SELECT</button>
      <button id="win-keep" class="ghost-btn" type="button">KEEP PLAYING</button>
    </div>
  </div>

  <div class="curtain" aria-hidden="true"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
